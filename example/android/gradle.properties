org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Hermetic build: prevent AGP from auto-downloading platforms and cmake.
# All dependencies are pinned in flake.nix and mirrored to .android-sdk.
org.gradle.offline=false
android.gradle.plugins.ndk.cmakeVersion=3.22.1
# Ensure the sdk.dir points to the Nix-pinned Android SDK (set via ANDROID_SDK_ROOT in flake.nix shellHook)
# Note: AGP respects ANDROID_SDK_ROOT; explicit sdk.dir in local.properties overrides
